name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-test-scan:
    name: Build, Test, and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: docker build -t github-actions-devops-practice:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: github-actions-devops-practice:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH